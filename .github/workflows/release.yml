name: Release

# Push a version tag (e.g. v1.0.1) to build the MO2/Vortex-installable zips
# and publish them as a GitHub Release.
#
# Note: the workflow only PACKAGES the committed mod folders. It cannot compile
# AdamantBlock.dll (needs the game's Assembly-CSharp.dll as a reference) nor build
# Resources/adamant.unity3d (needs Unity), so those two binaries must stay committed
# in the repo. Text config is validated for well-formedness before release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Game versions this mod release was ACTUALLY launched and verified on. Only
# tested builds get named - the Harmony patches (Block.DamageBlock and the atlas
# postfix) are what breaks silently on a new build, so "probably works" is not a
# claim we make on the mod page. Re-test and update this before every release;
# the procedure is in docs/build-and-release.md.
env:
  TESTED_VERSIONS: "3.0.0, 3.0.1 and 3.1.0"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate XML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          find AdamantBlock AdamantBlock-Creative -name '*.xml' -print0 \
            | xargs -0 -I{} xmllint --noout "{}"
          echo "All XML well-formed."

      - name: Sanity-check installable structure
        run: |
          test -f AdamantBlock/ModInfo.xml
          test -f AdamantBlock/AdamantBlock.dll
          test -f AdamantBlock/Resources/adamant.unity3d
          test -f AdamantBlock-Creative/ModInfo.xml
          test -f AdamantBlock-Creative/AdamantBlock.dll
          test -f AdamantBlock-Creative/Resources/adamant.unity3d
          # meta.ini is MO2-internal and must never ship inside a release zip
          ! find AdamantBlock AdamantBlock-Creative -name 'meta.ini' | grep -q .
          echo "Structure OK."

      - name: Package mod editions
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          # zip from repo root so the mod folder (with ModInfo.xml) is the zip root,
          # which is what MO2 and Vortex's 7D2D installer expect.
          zip -r -X "dist/AdamantBlock-Survival-${TAG}.zip"  AdamantBlock
          zip -r -X "dist/AdamantBlock-Creative-${TAG}.zip"  AdamantBlock-Creative
          echo "--- zip contents (survival) ---"
          unzip -l "dist/AdamantBlock-Survival-${TAG}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            7 Days to Die V3.0 / V3.1 - install **one** edition. Tested on
            **${{ env.TESTED_VERSIONS }}**; other 3.x builds are untested. No other mods
            needed; EasyAntiCheat must be **off** (Harmony DLL). Multiplayer: client + server.

            - **Survival** - rare Adamant Ore → workbench Adamant Ingot → block + spike trap.
            - **Creative** - 1 wood → block.

            Installable with MO2 or Vortex (drop the zip in, or extract into `Mods/`).

      # ---- Nexus Mods upload ------------------------------------------------
      # Setup (repo Settings -> Secrets and variables -> Actions):
      #   Secret    NEXUSMODS_API_KEY            personal API key
      #   Variable  NEXUSMODS_FILE_ID_SURVIVAL   Files tab -> "API Info" on the mod page
      #   Variable  NEXUSMODS_FILE_ID_CREATIVE   ditto, for the Creative file entry
      #
      # The v3 Upload API can only add a VERSION to a file entry that already
      # exists - its OpenAPI schema has no endpoint that creates a mod page. So
      # the mod page and both file entries must be created by hand on the website
      # once; every tag after that updates them automatically.
      #
      # The two steps are skipped while their variable is unset, so tagging works
      # before the mod page exists. Setting/clearing the variable is the on/off
      # switch for automatic publishing.
      - name: Derive Nexus version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The Nexus *file* description is what a user reads next to the download
      # button, so it says what this edition IS, then what changed. The mini
      # changelog is the current version's CHANGELOG.md section, flattened to at
      # most 6 one-line bullets. No section for this version -> blurb only.
      - name: Build mini changelog
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re

          version = os.environ["VERSION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()

          # the "## <version> - <date>" section, up to the next "## "
          body, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line[3:].strip().startswith(version + " ")
                  continue
              if inside:
                  body.append(line)

          # top-level "- " bullets, continuation lines folded in
          bullets, cur = [], None
          for line in body:
              if line.startswith("- "):
                  if cur:
                      bullets.append(cur)
                  cur = line[2:]
              elif cur is not None and line.startswith("  ") and line.strip():
                  cur += " " + line.strip()
              elif cur:
                  bullets.append(cur)
                  cur = None
          if cur:
              bullets.append(cur)

          def plain(s):
              s = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", s)  # md links -> text
              s = s.replace("**", "").replace("`", "")
              return re.sub(r"\s+", " ", s).strip()

          def condense(text, limit=180):
              """Whole sentences up to `limit`; word-truncate if that stays too short."""
              if len(text) <= limit:
                  return text
              kept = ""
              for sentence in re.split(r"(?<=\.)\s+", text):
                  if kept and len(kept) + len(sentence) > limit:
                      break
                  kept = (kept + " " + sentence).strip()
                  if len(kept) >= 120:
                      break
              if len(kept) >= 70:
                  return kept
              short = text[:limit].rsplit(" ", 1)[0].rstrip(" ,;-")
              return short + "..." if len(short) < len(text) else text

          out = ["- " + condense(plain(b)) for b in bullets[:6]]

          changelog = ""
          if out:
              changelog = "What's new in %s:\n%s\n\n" % (version, "\n".join(out))
          changelog += "Full changelog: %s/%s/releases/tag/%s" % (
              os.environ["GITHUB_SERVER_URL"],
              os.environ["GITHUB_REPOSITORY"],
              os.environ["GITHUB_REF_NAME"],
          )

          print("changelog<<__EOF__")
          print(changelog)
          print("__EOF__")
          PY

      - name: Upload Survival edition to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID_SURVIVAL != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID_SURVIVAL }}
          filename: dist/AdamantBlock-Survival-${{ github.ref_name }}.zip
          display_name: Survival ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          category: main
          # Moves the previous version into the archive instead of leaving it
          # listed. Flip to false to keep every version visible in the Files tab.
          archive_existing_version: true
          # Only on the main file, so the mod page version tracks the Survival zip.
          update_mod_version: true
          description: |
            Survival version of the mod: you have to find Adamant Ore while mining
            iron, lead or coal, smelt it into an Adamant Ingot and craft the block
            and the spike trap at the workbench. Install this OR the Creative
            edition, not both.

            Tested on game version ${{ env.TESTED_VERSIONS }}; other 3.x builds are
            untested. No other mods required. Contains a Harmony DLL, so EasyAntiCheat
            must be off. Multiplayer: install on client and server.

            ${{ steps.notes.outputs.changelog }}

      - name: Upload Creative edition to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID_CREATIVE != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID_CREATIVE }}
          filename: dist/AdamantBlock-Creative-${{ github.ref_name }}.zip
          display_name: Creative ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          category: optional
          archive_existing_version: true
          description: |
            Creative / cheat version of the mod: no ore, no ingot, no unlocks - you
            craft the block and the spike trap from 1 wood straight out of your
            backpack. For builders and testing. Install this OR the Survival
            edition, not both.

            Tested on game version ${{ env.TESTED_VERSIONS }}; other 3.x builds are
            untested. No other mods required. Contains a Harmony DLL, so EasyAntiCheat
            must be off. Multiplayer: install on client and server.

            ${{ steps.notes.outputs.changelog }}
