name: Release

# Push a version tag (e.g. v1.0.1) to build the MO2/Vortex-installable zips
# and publish them as a GitHub Release.
#
# Note: the workflow only PACKAGES the committed mod folders. It cannot compile
# AdamantBlock.dll (needs the game's Assembly-CSharp.dll as a reference) nor build
# Resources/adamant.unity3d (needs Unity), so those two binaries must stay committed
# in the repo. Text config is validated for well-formedness before release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Game versions this mod release was ACTUALLY launched and verified on. Only
# tested builds get named - the Harmony patches (Block.DamageBlock and the atlas
# postfix) are what breaks silently on a new build, so "probably works" is not a
# claim we make on the mod page. Re-test and update this before every release;
# the procedure is in docs/build-and-release.md.
env:
  # Nexus mod UID for the v3 API (not the number in the mod page URL).
  NEXUS_MOD_UID: "4548370378066"
  TESTED_VERSIONS: "3.4.0"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate XML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          find AdamantBlock AdamantBlock-Creative -name '*.xml' -print0 \
            | xargs -0 -I{} xmllint --noout "{}"
          echo "All XML well-formed."

      - name: Sanity-check installable structure
        run: |
          test -f AdamantBlock/ModInfo.xml
          test -f AdamantBlock/AdamantBlock.dll
          test -f AdamantBlock/Resources/adamant.unity3d
          test -f AdamantBlock-Creative/ModInfo.xml
          test -f AdamantBlock-Creative/AdamantBlock.dll
          test -f AdamantBlock-Creative/Resources/adamant.unity3d
          # meta.ini is MO2-internal and must never ship inside a release zip
          ! find AdamantBlock AdamantBlock-Creative -name 'meta.ini' | grep -q .
          echo "Structure OK."

      - name: Package mod editions
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          # zip from repo root so the mod folder (with ModInfo.xml) is the zip root,
          # which is what MO2 and Vortex's 7D2D installer expect.
          zip -r -X "dist/AdamantBlock-Survival-${TAG}.zip"  AdamantBlock
          zip -r -X "dist/AdamantBlock-Creative-${TAG}.zip"  AdamantBlock-Creative
          echo "--- zip contents (survival) ---"
          unzip -l "dist/AdamantBlock-Survival-${TAG}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            7 Days to Die V3.4 - install **one** edition. Tested on
            **${{ env.TESTED_VERSIONS }}**. No other mods needed; EasyAntiCheat must be
            **off** (Harmony DLL). Multiplayer: client + server.

            - **Survival** - rare Adamant Ore → workbench Adamant Ingot → block + spike trap.
            - **Creative** - 1 wood → block.

            Installable with MO2 or Vortex (drop the zip in, or extract into `Mods/`).

      # ---- Nexus Mods upload ------------------------------------------------
      # Setup (repo Settings -> Secrets and variables -> Actions):
      #   Secret    NEXUSMODS_API_KEY            personal API key
      #   Variable  NEXUSMODS_FILE_ID_SURVIVAL   Files tab -> "API Info" on the mod page
      #   Variable  NEXUSMODS_FILE_ID_CREATIVE   ditto, for the Creative file entry
      #
      # The v3 Upload API can only add a VERSION to a file entry that already
      # exists - its OpenAPI schema has no endpoint that creates a mod page. So
      # the mod page and both file entries must be created by hand on the website
      # once; every tag after that updates them automatically.
      #
      # The two steps are skipped while their variable is unset, so tagging works
      # before the mod page exists. Setting/clearing the variable is the on/off
      # switch for automatic publishing.
      - name: Derive Nexus version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The Nexus *file* description is what a user reads next to the download
      # button, so it says what this edition IS, then what changed. The mini
      # changelog is the current version's CHANGELOG.md section, flattened to at
      # most 6 one-line bullets. No section for this version -> blurb only.
      # The mod page's Changelogs tab gets this version's CHANGELOG.md bullets in full,
      # one entry per line. The Nexus endpoint only appends, so re-running a tag adds the
      # same lines a second time. No section for this version -> nothing is posted.
      - name: Build Nexus changelog entries
        id: clentries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(version) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          entries = []
          if m:
              # fold continuation lines into their bullet; the whitespace after the marker
              # keeps a wrapped line that starts with **bold** from looking like a new bullet
              raw = re.sub(r"\n(?!\s*[-*]\s)", " ", m.group(1))
              for line in raw.splitlines():
                  line = line.strip()
                  if not re.match(r"[-*]\s", line):
                      continue
                  line = re.sub(r"^[-*]\s+", "", line)
                  line = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", line)  # md links -> text
                  line = re.sub(r"[`*]", "", line)  # not "_": identifiers use it
                  entries.append(re.sub(r"\s+", " ", line).strip())
          print("entries<<__EOF__")
          print("\n".join(entries))
          print("__EOF__")
          PY

      - name: Upload Survival edition to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID_SURVIVAL != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID_SURVIVAL }}
          filename: dist/AdamantBlock-Survival-${{ github.ref_name }}.zip
          display_name: Survival ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          category: main
          # Moves the previous version into the archive instead of leaving it
          # listed. Flip to false to keep every version visible in the Files tab.
          archive_existing_version: true
          # Only on the main file, so the mod page version tracks the Survival zip.
          update_mod_version: true
          # Appends this version's CHANGELOG.md bullets to the Changelogs tab.
          mod_id: ${{ env.NEXUS_MOD_UID }}
          changelog: ${{ steps.clentries.outputs.entries }}
          # Nexus rejects a file description over 255 characters (422). What changed goes
          # to the Changelogs tab via `changelog`, so this stays a short summary.
          description: >-
            Survival edition: mine Adamant Ore, smelt it, craft the block and spike trap at
            the workbench. Install this OR Creative. Tested on ${{ env.TESTED_VERSIONS }}.
            EasyAntiCheat off.
            Changelog: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Upload Creative edition to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID_CREATIVE != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID_CREATIVE }}
          filename: dist/AdamantBlock-Creative-${{ github.ref_name }}.zip
          display_name: Creative ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          category: optional
          archive_existing_version: true
          # Nexus rejects a file description over 255 characters (422). What changed goes
          # to the Changelogs tab via `changelog`, so this stays a short summary.
          description: >-
            Creative edition: block and spike trap from 1 wood, no ore, no unlocks. For
            builders and testing. Install this OR Survival. Tested on ${{ env.TESTED_VERSIONS }}.
            EasyAntiCheat off.
            Changelog: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      # The mod page description is nexus/description.bbcode, sent as is. Nexus stores it
      # exactly as if it had been saved in the website editor (v3 editMod), so the repo
      # file is the only place the description is edited. The endpoint is marked
      # Experimental by Nexus and takes the mod UID, not the number in the page URL
      # (UID = 1059 * 2^32 + mod number for 7 Days to Die).
      - name: Update Nexus mod page description
        if: ${{ vars.NEXUSMODS_FILE_ID_SURVIVAL != '' }}
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          jq -Rs '{description: .}' nexus/description.bbcode > "$RUNNER_TEMP/desc.json"
          status=$(curl -sS -o "$RUNNER_TEMP/desc.out" -w '%{http_code}' -X PATCH \
            -H "apikey: $NEXUSMODS_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Application-Name: ${GITHUB_REPOSITORY#*/}-release" \
            -H "Application-Version: ${GITHUB_REF_NAME#v}" \
            --data @"$RUNNER_TEMP/desc.json" \
            "https://api.nexusmods.com/v3/mods/${NEXUS_MOD_UID}")
          if [ "$status" != "204" ]; then
            echo "::error::Nexus description update failed with HTTP $status"
            cat "$RUNNER_TEMP/desc.out"
            exit 1
          fi
          echo "Mod page description updated from nexus/description.bbcode."
